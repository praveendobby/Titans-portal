<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200">
  <title>Titans Portal - Team Management System</title>
  <meta name="description" content="Titans Portal is a team management system for tasks, members, and collaboration.">
  <meta name="keywords" content="Titans Portal, team management, task manager, Titans">
  <meta name="author" content="Titans Team">
  <meta name="google-site-verification" content="eutEHVzGDbbnSkUlJ7p9mNimwNv7bJkXCkwYkcLv4iE" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#8b5cf6" />
  <meta name="apple-mobile-web-app-title" content="TITANS" />
  <link rel="icon" type="image/png" href="img/titans-icon.png" />

  <!-- ✅ Load auth.js FIRST so handleCredentialResponse exists -->
  <script src="auth.js"></script>

  <!-- ✅ Load Google Sign-In AFTER auth.js -->
  <script src="https://accounts.google.com/gsi/client"></script>

</head>
<body>

  <div class="login-container">

    <!-- LOGO -->
    <div class="login-logo-wrap">
      <div class="login-bolt">⚡</div>
      <h1 class="logo">TITANS</h1>
      <p class="tag">Team Management System</p>
    </div>

    <!-- EMAIL / PASSWORD FORM -->
    <form id="loginForm" onsubmit="login(); return false;">
      <div class="input-wrap">
        <span class="input-icon">✉</span>
        <input type="email" id="email" placeholder="Team Email" required autocomplete="off" />
      </div>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Password" required autocomplete="off" />
      </div>
      <button type="submit" class="login-btn">Login →</button>
      <p id="errorMessage" class="error-message"></p>
    </form>

    <!-- DIVIDER -->
    <div class="divider"><span>OR</span></div>

    <!-- GOOGLE SIGN-IN BUTTON -->
    <div
      id="g_id_onload"
      data-client_id="92364977850-hngkiov4is4n3q2n5qa0pkb6ugqnq2uo.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
      data-auto_prompt="false"
      data-cancel_on_tap_outside="false">
    </div>

    <div
      class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="filled_black"
      data-text="signin_with"
      data-shape="pill"
      data-logo_alignment="left"
      data-width="310">
    </div>

    <p class="login-footer">Access restricted to TITANS members only</p>

  </div>

</body>
</html>
